# One defect: a node declaring no instances of itself. Suffixes count from one
# and an omitted suffix means one, so a node with zero instances is one no
# header can reach. Exactly one problem, naming `node[1].suffixes`.

[identity]
manufacturer = "Attrappe"
model = "EMULATED-DMM-BROKEN"
serial = "0000000007"
firmware = "0.1.0"

[error_queue]
depth = 8

[[node]]
path = "ROUTE"
short = "ROUT"

[[node]]
path = "ROUTE:CHANNEL"
short = "CHAN"
suffixes = 0
