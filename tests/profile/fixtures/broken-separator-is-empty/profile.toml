# One defect: a response separator with nothing in it. A device that ran two
# values together is one whose response a driver reads as a single value.
# Exactly one problem, naming `response.separator`.

[identity]
manufacturer = "Attrappe"
model = "EMULATED-DMM-BROKEN"
serial = "0000000008"
firmware = "0.1.0"

[error_queue]
depth = 8

[response]
separator = ""

[[node]]
path = "SENSE"
short = "SENS"
