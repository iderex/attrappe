# The gate. One workflow, run on every pull request to the mainline and on every
# push to it, with one job per leg and a check-run name that is quoted elsewhere
# and must not drift.
#
# This file is incomplete on purpose, and the legs it carries are not written out
# here. Each job below names which legs it wants, with `--only`, and tools/gate.py
# holds what a leg is and in what order the legs run. A leg that is absent is
# absent rather than stubbed green, so a run that covered some legs cannot be
# read as one that covered them all and found nothing.
#
# The `wiring` leg reads this file and refuses a `--only` naming a leg the gate
# command does not have. The other direction is not refused by anything: `tests`
# is a leg no job here selects, because the check-run name for it and the version
# matrix behind it are #19's to fix and neither is settled. The gate command
# prints that gap on every run.
#
# An earlier version of this header said which legs existed. That went stale the
# first time a job was added beside it, so the count is no longer written down:
# the jobs below are the list, and a sentence restating them drifts against
# them.
#
# Hardened to the same bar as the guards already in this repository: every action
# pinned to a full commit hash with the version in a trailing comment, checkout
# without persisted credentials, read-only permissions declared at the top level
# and never widened at the workflow level, a timeout on every job, and a
# concurrency group that cancels a superseded run. Cancelling is safe here
# because no leg publishes anything.
name: Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only: no leg writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # The check-run name is this string verbatim, and the slash is part of it,
    # for the reason set out on the types job below.
    name: Gate / lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The floor from docs/decisions/0001-implementation-language.md, which
          # is also what `target-version` in pyproject.toml names. Linting on a
          # newer interpreter would judge against a language the floor has not
          # got.
          python-version: "3.11"

      - name: Install the linter
        # The package is not installed: the linter reads source and imports
        # nothing from it. One group, one dependency.
        run: python -m pip install --group lint

      - name: Run the format and lint legs
        # The tools and their flags are in tools/gate.py, not here. This job
        # names which legs it wants and nothing about how they are run, so the
        # list of legs is in one place and the local command and this job cannot
        # drift apart.
        run: python tools/gate.py --only format,lint

  types:
    # The check-run name is this string verbatim, and the slash is part of it.
    #
    # A check run is named after the job and after nothing else. The workflow
    # name is not a prefix: it is shown beside the check in the pull-request UI,
    # which reads like a prefix and is not one. Measured on this repository
    # rather than assumed, by asking the API what a run of an earlier version of
    # this file was actually called:
    #
    #     gh api repos/iderex/attrappe/commits/cdf764c/check-runs --jq '.check_runs[].name'
    #
    # which answered `types` while the UI showed "Gate / types". The ruleset and
    # every list of required checks match the API's name, so the slash has to be
    # inside this value or the name that gets quoted elsewhere does not exist.
    name: Gate / types
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The floor from docs/decisions/0001-implementation-language.md. The
          # checker is configured for this version in pyproject.toml, and running
          # it on a newer interpreter would check against a language the
          # supported floor does not have.
          python-version: "3.11"

      - name: Install the package and the checkers
        # Editable so the checker resolves the package the way a contributor's
        # environment does. `types` pins the checker; `workflows` pins the stubs
        # it needs to check the workflow audit, which is under tools/ and is
        # checked like anything else; `tests` pins the runner, whose types the
        # suite imports and which the checker cannot resolve without it.
        run: python -m pip install -e . --group types --group workflows --group tests

      - name: Run the types leg
        run: python tools/gate.py --only types

  workflows:
    # As with the types job above, the slash is part of the name because a check
    # run carries the job name alone.
    name: Gate / workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The audit reads the tree and the git index. It pushes nothing.
          persist-credentials: false
          # The audit takes its file list from `git ls-files`, which needs the
          # index. A checkout provides it; no history beyond the head is read,
          # so the default shallow fetch is enough.

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the YAML parser
        # The audit imports nothing from the package, so the package is not
        # installed here. One group, one dependency.
        run: python -m pip install --group workflows

      - name: Run the wiring and workflow legs
        # `wiring` reads this file and refuses a `--only` naming a leg the gate
        # command does not have, so a typo in one of these steps is a refusal
        # rather than a job that passes having run nothing. It is here because
        # this is the job that already installs the YAML parser it needs.
        run: python tools/gate.py --only wiring,workflows,required-checks

  injection:
    # As with the jobs above, the slash is part of the name because a check run
    # carries the job name alone.
    name: Gate / injection
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The audit reads the tree and the git index. It pushes nothing.
          persist-credentials: false
          # The file list comes from `git ls-files`, which needs the index. A
          # checkout provides it; no history beyond the head is read, so the
          # default shallow fetch is enough.

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The floor from docs/decisions/0001-implementation-language.md. The
          # audit uses tomllib, which is standard from that floor, and nothing
          # else outside the standard library.
          python-version: "3.11"

      - name: Run the injection leg
        # Two commands inside one leg, in tools/gate.py: the self-test first,
        # because a rule that has stopped refusing its own fixture makes the run
        # over the tree meaningless, and the run over the tree second. Nothing is
        # installed for either: the audit reads the package's source as text and
        # never imports it.
        run: python tools/gate.py --only injection
