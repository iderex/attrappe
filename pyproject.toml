[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "attrappe"
description = "An instrument emulator that answers a measurement driver the way an instrument does, including the inconvenient parts."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]

# The runtime dependency list is empty and every addition to it is argued in the
# issue that adds it. TOML parsing, which the profile format needs, is tomllib in
# the standard library from the version floor in docs/decisions/0001.
dependencies = []

# No license field and no license classifier. The license of this repository is
# an open question for the maintainer and nothing here may assume an answer to
# it.
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Emulators",
]

[project.urls]
Source = "https://github.com/iderex/attrappe"
Issues = "https://github.com/iderex/attrappe/issues"

# Development tools, one group per gate leg. These are not runtime dependencies
# and never reach a distribution: [project.dependencies] above stays empty.
# Each group is added by the issue that introduces its leg.
[dependency-groups]
# mypy because it configures out of this file, needs no runtime beyond the one
# already chosen, and its `strict` bundle is maintained upstream rather than
# copied here. A checker needing a second runtime would fail that test.
types = ["mypy>=2.3.0"]
# PyYAML because the workflow audit has to read the workflow files as YAML.
# Matching them with regular expressions is the shape this repository already
# has a reason to avoid: enforcement logic that word-splits its input and
# refuses valid work. There is no YAML parser in the standard library, so the
# dependency is forced rather than chosen, and it is held to one dev group.
workflows = ["pyyaml>=6.0", "types-pyyaml>=6.0"]
# Ruff because it is the formatter and the linter in one binary, configured out
# of this file, with no runtime beyond the one already chosen. Two tools would
# mean two configurations that can disagree about the same bytes, and a
# disagreement between a formatter and a linter is settled by whoever ran last.
lint = ["ruff>=0.16.2"]

# The version is declared in exactly one place. The build backend reads the
# literal out of the package rather than carrying a second copy of it here, so a
# distribution can disagree with an import only if this line is wrong.
[tool.hatch.version]
path = "src/attrappe/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/attrappe"]

# The lint, type and test tool tables belong in this file and not in four more.
# Each one is added by the issue that introduces its tool, so that the settings
# arrive with the check that depends on them rather than ahead of it.

[tool.ruff]
# The floor from docs/decisions/0001-implementation-language.md. The rewrites the
# linter proposes are chosen against the oldest supported syntax, so a fix it
# offers cannot be one the floor refuses.
target-version = "py311"

# The number lives here rather than in anybody's head, and it is 100 rather than
# the tool's default of 88 for a measured reason. At 88 the formatter leaves five
# lines it cannot shorten: they are string literals at a deep indentation, and
# the formatter does not split a string. On a throwaway checkout of c05e915,
# which the next command rewrites in place:
#
#     ruff format --line-length 88 . && ruff check --select E501 --line-length 88 .
#     Found 5 errors.
#     ruff format --line-length 100 . && ruff check --select E501 --line-length 100 .
#     All checks passed!
#
# A limit that needs five suppressions on the day it lands is a limit nobody
# obeys. At 100 the formatter reaches every line in the tree and E501 refuses
# what is left over.
line-length = 100

[tool.ruff.lint]
# One group per entry, each with the reason it is on. A rule set copied wholesale
# with no comment is a rule set nobody can argue with later, and the argument is
# the point: a group here is one somebody decided to keep.
select = [
  # Pyflakes. Unused imports and unused local names, undefined names, an f-string
  # with no placeholder, and `is` against a literal. This is the group that finds
  # what a refactor left behind, and the leftovers of a refactor are exactly what
  # a reader assumes is still load-bearing.
  "F",
  # pycodestyle errors. A bare `except:`, which swallows the interrupt that stops
  # a soak run as readily as the error it was aimed at; `== None` and `== True`,
  # which read as the identity test they are not; and the line limit above. These
  # are mistakes that read correctly and behave differently.
  "E",
  # pycodestyle warnings. Trailing whitespace and a missing final newline. Both
  # survive a formatter nobody ran and both put lines in a later diff that
  # nobody changed, which is what makes a review read the wrong hunk.
  "W",
  # isort. Import order, so an added import lands in one place rather than
  # wherever the cursor was, and two branches adding an import do not conflict
  # over which line it went on.
  "I",
  # flake8-bugbear. The mutable default argument first, because a default list
  # shared across every call is the bug this project would meet as a fault
  # schedule that remembers the last run. The rest of the group has the same
  # shape: legal code that reads as intended and does something else.
  "B",
]

[tool.mypy]
# The floor from docs/decisions/0001-implementation-language.md. Checking against
# a newer version would accept syntax the supported floor rejects.
python_version = "3.11"
mypy_path = "src"
# Both the package and the repository tooling. A script that gates a merge is
# not exempt from the check it gates with.
files = ["src/attrappe", "tools"]

# Strictest practical mode. `strict` is the bundle mypy itself maintains, so the
# set grows when mypy grows it rather than drifting against a list copied here
# once. The three below are outside that bundle and are named individually.
strict = true
warn_unreachable = true
enable_error_code = [
  "redundant-expr",
  "truthy-bool",
  "ignore-without-code",
]
# An unused ignore is a claim about an error that no longer happens, so it is an
# error rather than a comment.
warn_unused_ignores = true
pretty = true

# Third-party libraries without type information get a per-module entry here,
# each with a comment naming the library and why it has none. Never a global
# relaxation: `ignore_missing_imports` at the top level would silence every
# future import at once, and the point of this list is that its growth is
# visible in the diff.
#
# An entry is a [[tool.mypy.overrides]] block naming the module and setting
# ignore_missing_imports, with the comment above it.
#
# The list is empty and no such block exists. The runtime dependency list in
# [project] is also empty, so there is nothing yet that could need an entry.
